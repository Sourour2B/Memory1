<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Memory des Souvenirs de l'Année 2026 La Valentine</title>
  <style>
    :root {
      --bg-color: #0E5A46;
      --card-back: #5C1D24;
      --gold: #C5A059;
      --text-light: #fdfbf7;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      /* Charge automatiquement fond-noel quel que soit son format (.jpg, .png, .jpeg, .webp) */
      background-image:
        linear-gradient(rgba(14, 42, 33, 0.45), rgba(14, 42, 33, 0.65)),
        url('images/fond-noel.jpg'),
        url('images/fond-noel.png'),
        url('images/fond-noel.jpeg'),
        url('images/fond-noel.webp'),
        url('images/fond-noel.JPG'),
        url('images/fond-noel.PNG'),
        url('fond-noel.jpg'),
        url('fond-noel.png'),
        radial-gradient(circle at center, #264b3e 0%, #11241d 100%);
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      color: var(--text-light);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 2rem;
      color: var(--gold);
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.7);
      margin-bottom: 8px;
    }

    .stats {
      display: flex;
      align-items: center;
      gap: 20px;
      justify-content: center;
      font-size: 1.1rem;
      background: rgba(0, 0, 0, 0.5);
      padding: 8px 20px;
      border-radius: 20px;
      border: 1px solid rgba(212, 175, 55, 0.4);
    }

    .music-btn {
      background: rgba(197, 160, 89, 0.2);
      color: var(--gold);
      border: 1px solid var(--gold);
      border-radius: 15px;
      padding: 4px 12px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s, color 0.2s;
    }

    .music-btn:hover {
      background-color: var(--gold);
      color: var(--bg-color);
    }

    .game-board {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 15px;
      max-width: 720px;
      width: 100%;
      perspective: 1000px;
    }

    .card {
      aspect-ratio: 1 / 1;
      position: relative;
      cursor: pointer;
      transform-style: preserve-3d;
      transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
    }

    .card.flipped, .card.matched {
      transform: rotateY(180deg);
    }

    .card.matched {
      cursor: default;
    }

    .card-face {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
      overflow: hidden;
    }

    .card-front {
      background: linear-gradient(135deg, var(--card-back), #5e1812);
      border: 2px solid var(--gold);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
    }

    .card-front::after {
      content: "🎄";
      filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.3));
    }

    .card-back {
      transform: rotateY(180deg);
      background-color: #1c382e;
      border: 3px solid var(--text-light);
    }

    .card.matched .card-back {
      border-color: var(--gold);
      box-shadow: 0 0 15px rgba(212, 175, 55, 0.7);
    }

    .card-back img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .card-caption {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: linear-gradient(to top, rgba(17, 36, 29, 0.95) 0%, rgba(17, 36, 29, 0.75) 75%, transparent 100%);
      color: var(--text-light);
      padding: 18px 8px 8px 8px;
      font-size: 0.85rem;
      font-weight: 600;
      text-align: center;
      line-height: 1.2;
      opacity: 0;
      transform: translateY(100%);
      transition: opacity 0.4s ease 0.2s, transform 0.4s ease 0.2s;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
    }

    .card.matched .card-caption {
      opacity: 1;
      transform: translateY(0);
    }

    .victory-banner {
      display: none;
      margin-top: 25px;
      text-align: center;
      background: rgba(0, 0, 0, 0.65);
      padding: 20px 30px;
      border-radius: 15px;
      border: 2px solid var(--gold);
      animation: fadeIn 0.5s ease-in-out;
    }

    .victory-banner h2 {
      color: var(--gold);
      margin-bottom: 10px;
    }

    button.restart-btn {
      margin-top: 12px;
      padding: 10px 24px;
      font-size: 1rem;
      font-weight: bold;
      color: var(--bg-color);
      background-color: var(--gold);
      border: none;
      border-radius: 25px;
      cursor: pointer;
      transition: transform 0.2s, background-color 0.2s;
    }

    button.restart-btn:hover {
      transform: scale(1.05);
      background-color: #e5c158;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 550px) {
      .game-board { gap: 8px; }
      h1 { font-size: 1.5rem; }
      .stats { flex-wrap: wrap; gap: 10px; font-size: 0.95rem; }
      .card-caption { font-size: 0.72rem; padding: 12px 4px 4px 4px; }
    }
  </style>
</head>
<body>

  <header>
    <h1>✨ Rétrospective de l'Année 2026 Team La Valentine ✨</h1>
    <div class="stats">
      <span>Coups : <strong id="moves">0</strong></span>
      <span>Paires trouvées : <strong id="pairs">0</strong> / <strong id="total-pairs">8</strong></span>
      <button type="button" id="music-toggle" class="music-btn" aria-pressed="false">🔇 Musique</button>
    </div>
  </header>

  <div class="game-board" id="game-board"></div>

  <div class="victory-banner" id="victory-banner">
    <h2>🎉 Bravo ! Tous les souvenirs ont été retrouvés ! 🎉</h2>
    <p id="final-stats"></p>
    <button class="restart-btn" onclick="initGame()">Rejouer</button>
  </div>

  <script>
    // ============================================================
    // CONFIGURATION
    // ============================================================
    const DOSSIER_IMAGES = "images/";
    const FICHIER_MUSIQUE = "audio/musique-noel.mp3";

    const SOUVENIRS = [
      { fichier: "photo1", legende: "Le père Noël de la Valentine" },
      { fichier: "photo2", legende: "Epiphanie" },
      { fichier: "photo3", legende: "Repas Noël 2026 " },
      { fichier: "photo4", legende: "Un matin au brief" },
      { fichier: "photo5", legende: "Crêpe party à la valentine" },
      { fichier: "photo6", legende: "Sapin de Noël des adultes" },
      { fichier: "photo7", legende: "ELD de la Valentine" },
      { fichier: "photo8", legende: "Repas partagé à La Valentine" }
    ];

    // ============================================================
    // CHARGEMENT MULTI-FORMAT DES PHOTOS DES CARTES
    // ============================================================
    const FORMATS = ["jpg", "png", "jpeg", "webp", "JPG", "PNG", "JPEG", "WEBP"];

    function chargerPhoto(img, nomSansExt) {
      let i = 0;
      function essayer() {
        if (i >= FORMATS.length) return;
        const ext = FORMATS[i++];
        img.onerror = essayer;
        img.src = DOSSIER_IMAGES + nomSansExt + "." + ext;
      }
      essayer();
    }

    // ============================================================
    // EFFETS SONORES (CLIC + CLOCHE DE NOËL)
    // ============================================================
    let audioCtx = null;

    function jouerSon(callback) {
      try {
        if (!audioCtx) {
          const AC = window.AudioContext || window.webkitAudioContext;
          audioCtx = new AC();
        }
        if (audioCtx.state === "suspended") {
          audioCtx.resume().then(() => callback(audioCtx)).catch(() => {});
        } else {
          callback(audioCtx);
        }
      } catch (e) {}
    }

    function playCardClickSound() {
      jouerSon((ctx) => {
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "triangle";
        osc.frequency.setValueAtTime(340, now);
        osc.frequency.exponentialRampToValueAtTime(580, now + 0.085);
        gain.gain.setValueAtTime(0.001, now);
        gain.gain.linearRampToValueAtTime(0.22, now + 0.012);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.11);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.12);
      });
    }

    function playChristmasBellSound() {
      jouerSon((ctx) => {
        const now = ctx.currentTime;
        const notes = [
          { freq: 1318.5, start: 0, duration: 0.9 },
          { freq: 1661.2, start: 0.14, duration: 1.1 }
        ];
        notes.forEach(({ freq, start, duration }) => {
          [1, 2, 2.756].forEach((ratio, idx) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = "sine";
            osc.frequency.setValueAtTime(freq * ratio, now + start);
            gain.gain.setValueAtTime(0.0001, now + start);
            gain.gain.linearRampToValueAtTime(0.28 / (idx + 1), now + start + 0.01);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + start + duration / ratio);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now + start);
            osc.stop(now + start + duration);
          });
        });
      });
    }

    // ============================================================
    // MUSIQUE DE FOND
    // ============================================================
    const bgMusic = new Audio(FICHIER_MUSIQUE);
    bgMusic.loop = true;
    bgMusic.volume = 0.35;

    const musicToggleBtn = document.getElementById("music-toggle");
    let musicStarted = false;
    let isPlaying = false;
    let fallbackTimer = null;
    let noteIndex = 0;

    const MELODIE_NOEL = [
      [659.25, 1], [659.25, 1], [659.25, 2],
      [659.25, 1], [659.25, 1], [659.25, 2],
      [659.25, 1], [783.99, 1], [523.25, 1.5], [587.33, 0.5], [659.25, 4]
    ];

    function lancerBoiteAMusique() {
      if (isPlaying) return;
      isPlaying = true;
      musicToggleBtn.textContent = "🔊 Musique";
      musicToggleBtn.setAttribute("aria-pressed", "true");

      function noteSuivante() {
        if (!isPlaying) return;
        const [freq, temps] = MELODIE_NOEL[noteIndex];
        const dureeMs = temps * 350;
        jouerSon((ctx) => {
          const now = ctx.currentTime;
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = "sine";
          osc.frequency.setValueAtTime(freq, now);
          gain.gain.setValueAtTime(0.0001, now);
          gain.gain.linearRampToValueAtTime(0.08, now + 0.015);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + dureeMs / 1000);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + dureeMs / 1000);
        });
        noteIndex = (noteIndex + 1) % MELODIE_NOEL.length;
        fallbackTimer = setTimeout(noteSuivante, dureeMs);
      }
      noteSuivante();
    }

    function demarrerMusique() {
      if (isPlaying) return;
      bgMusic.play().then(() => {
        isPlaying = true;
        musicToggleBtn.textContent = "🔊 Musique";
        musicToggleBtn.setAttribute("aria-pressed", "true");
      }).catch(() => {
        lancerBoiteAMusique();
      });
    }

    function arreterMusique() {
      bgMusic.pause();
      if (fallbackTimer) clearTimeout(fallbackTimer);
      isPlaying = false;
      musicToggleBtn.textContent = "🔇 Musique";
      musicToggleBtn.setAttribute("aria-pressed", "false");
    }

    musicToggleBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      musicStarted = true;
      if (isPlaying) arreterMusique();
      else demarrerMusique();
    });

    document.addEventListener("click", () => {
      if (!musicStarted) {
        musicStarted = true;
        demarrerMusique();
      }
    }, { once: true });

    // ============================================================
    // LOGIQUE DU JEU DE MEMORY
    // ============================================================
    const board = document.getElementById("game-board");
    const movesDisplay = document.getElementById("moves");
    const pairsDisplay = document.getElementById("pairs");
    const totalPairsDisplay = document.getElementById("total-pairs");
    const victoryBanner = document.getElementById("victory-banner");
    const finalStats = document.getElementById("final-stats");

    let flippedCards = [];
    let matchedPairs = 0;
    let moves = 0;
    let lockBoard = false;

    function initGame() {
      board.innerHTML = "";
      victoryBanner.style.display = "none";
      flippedCards = [];
      matchedPairs = 0;
      moves = 0;
      lockBoard = false;

      movesDisplay.textContent = moves;
      pairsDisplay.textContent = matchedPairs;
      totalPairsDisplay.textContent = SOUVENIRS.length;

      const deck = [...SOUVENIRS, ...SOUVENIRS];
      for (let i = deck.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [deck[i], deck[j]] = [deck[j], deck[i]];
      }

      deck.forEach((item) => {
        const card = document.createElement("div");
        card.className = "card";
        card.dataset.id = item.fichier;

        const front = document.createElement("div");
        front.className = "card-face card-front";

        const back = document.createElement("div");
        back.className = "card-face card-back";

        const img = document.createElement("img");
        img.alt = item.legende;
        chargerPhoto(img, item.fichier);

        const caption = document.createElement("div");
        caption.className = "card-caption";
        caption.textContent = item.legende;

        back.appendChild(img);
        back.appendChild(caption);
        card.appendChild(front);
        card.appendChild(back);

        card.addEventListener("click", flipCard);
        board.appendChild(card);
      });
    }

    function flipCard() {
      if (lockBoard) return;
      if (this === flippedCards[0]) return;
      if (this.classList.contains("matched")) return;

      playCardClickSound();
      this.classList.add("flipped");
      flippedCards.push(this);

      if (flippedCards.length === 2) {
        moves++;
        movesDisplay.textContent = moves;
        checkForMatch();
      }
    }

    function checkForMatch() {
      const [card1, card2] = flippedCards;
      const isMatch = card1.dataset.id === card2.dataset.id;

      if (isMatch) {
        playChristmasBellSound();
        card1.classList.add("matched");
        card2.classList.add("matched");
        flippedCards = [];
        matchedPairs++;
        pairsDisplay.textContent = matchedPairs;

        if (matchedPairs === SOUVENIRS.length) {
          setTimeout(() => {
            finalStats.textContent = `Vous avez complété la rétrospective en ${moves} coups.`;
            victoryBanner.style.display = "block";
          }, 600);
        }
      } else {
        lockBoard = true;
        setTimeout(() => {
          card1.classList.remove("flipped");
          card2.classList.remove("flipped");
          flippedCards = [];
          lockBoard = false;
        }, 1000);
      }
    }

    initGame();
  </script>
</body>
</html>
